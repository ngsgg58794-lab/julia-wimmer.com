<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test drive · Julia Wimmer</title>
<meta name="description" content="A three-minute game for recruiters: four short stops between Munich and Innsbruck to get to know Julia Wimmer, UX and product designer with a focus on digitalization and AI.">
<meta property="og:title" content="Take Julia for a test drive">
<meta property="og:description" content="A three-minute game for recruiters: four short stops, each one shows how Julia works.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://juliawimmer.de/img/portrait.jpeg">
<meta name="theme-color" content="#F2F3EF">
<link rel="icon" href="../favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="../favicon.png?v=2" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
/* Same data-sheet look as the main page: one ink, one process magenta, a measuring grid. */
:root{
  --paper:#F2F3EF; --paper-2:#E7E9E3; --ink:#0E0F0C; --grey:#55584F; --line:rgba(14,15,12,.16);
  --mag:#D6006F; --mag-soft:rgba(214,0,111,.12); --ok:#0B6B3A;
  --gut:clamp(16px,4.4vw,72px);
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'Archivo',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.55;overflow-x:clip}
h1,h2,h3,p,ol,ul,dl,dd{margin:0}
ol,ul{padding:0;list-style:none}
a{color:inherit}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--mag);outline-offset:3px}
[tabindex="-1"]:focus{outline:0}
::selection{background:var(--mag);color:#fff}
.mono{font-family:var(--mono);font-size:.75rem;line-height:1.4;letter-spacing:.04em;text-transform:uppercase;font-weight:500}
.m{color:var(--mag)}
.grey{color:var(--grey)}

/* title block */
.tb{display:grid;grid-template-columns:1.2fr 1.4fr 1fr .8fr;border-bottom:1px solid var(--ink)}
.tb>*{padding:12px 16px;border-left:1px solid var(--ink);min-width:0}
.tb>*:first-child{border-left:0;padding-left:var(--gut)}
.tb>*:last-child{padding-right:var(--gut)}
.tb small{display:block;font-family:var(--mono);font-size:.625rem;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);margin-bottom:2px}
.tb b{display:block;font-weight:700;font-size:.9375rem;line-height:1.25}
.tb a{text-decoration:none}
.tb a:hover b{color:var(--mag)}
.lg{display:flex!important;margin-top:3px}
.lg button{min-width:2.6rem;padding:3px 10px;border:1px solid var(--ink);background:none;font-family:var(--mono);font-size:.75rem;font-weight:500;cursor:pointer}
.lg button+button{margin-left:-1px}
.lg button:hover{background:var(--ink);color:var(--paper)}
.lg button[aria-pressed="true"]{background:var(--mag);border-color:var(--mag);color:#fff;position:relative}
@media (max-width:720px){
  .tb{grid-template-columns:1fr 1fr}
  .tb>*:nth-child(3){border-left:0;padding-left:var(--gut)}
  .tb>*:nth-child(n+3){border-top:1px solid var(--ink)}
  .tb>*:nth-child(2){padding-right:var(--gut)}
  .tb b{font-size:.8125rem}
}

/* route = progress */
.rt{padding:18px var(--gut) 14px;border-bottom:1px solid var(--ink)}
.rt ol{position:relative;display:flex;justify-content:space-between;max-width:880px;margin:0 auto}
.rt ol::before{content:"";position:absolute;left:8px;right:8px;top:7px;height:2px;background:repeating-linear-gradient(90deg,var(--ink) 0 10px,transparent 10px 16px)}
.rt li{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:16px;white-space:nowrap}
.rt li:first-child{align-items:flex-start}
.rt li:last-child{align-items:flex-end}
.rt i{display:block;width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);transition:background-color .25s ease,border-color .25s ease,transform .25s ease}
.rt li.done i{background:var(--ink)}
.rt li.cur i{background:var(--mag);border-color:var(--mag);transform:scale(1.25)}
.rt li.cur span{color:var(--mag)}
@media (max-width:560px){.rt li:not(:first-child):not(:last-child):not(.cur) span{visibility:hidden}}

/* stage */
main{flex:1;padding:clamp(28px,4.5vw,56px) var(--gut) 64px;
  background-image:linear-gradient(rgba(14,15,12,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(14,15,12,.06) 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px}
#stage{max-width:880px;margin:0 auto}
.scr{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kick{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.kick::before{content:"";width:28px;height:1px;background:var(--mag)}
h1,h2.big{font-size:clamp(2.2rem,6.4vw,4.4rem);line-height:.9;font-stretch:68%;font-weight:850;text-transform:uppercase;letter-spacing:-.012em}
h2.big{font-size:clamp(1.8rem,4.6vw,3rem)}
.lead{max-width:36em;margin-top:18px;font-size:1.0625rem}
.task{max-width:38em;margin-top:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:0 22px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700;text-decoration:none;cursor:pointer;transition:background-color .15s ease,border-color .15s ease,color .15s ease}
.btn:hover{background:var(--mag);border-color:var(--mag)}
.btn.mag{background:var(--mag);border-color:var(--mag);color:#fff}
.btn.mag:hover{background:var(--ink);border-color:var(--ink)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn svg{flex:none}
.lnk{background:none;border:0;padding:8px 0;font-family:var(--mono);font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;font-weight:500;color:var(--grey);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.lnk:hover{color:var(--mag)}
.card{margin-top:24px;padding:clamp(16px,2.6vw,26px);border:1px solid var(--ink);background:var(--paper)}
.st{min-height:1.4em;margin-top:14px;color:var(--grey)}
.st.bad{color:var(--mag)}
.st.good{color:var(--ok)}
.note{margin-top:10px;color:var(--grey)}
.shake{animation:shake .3s ease}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* intro */
.pre{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:30px;border:1px solid var(--ink);background:var(--paper)}
.pre li{padding:14px 16px;border-left:1px solid var(--line)}
.pre li:first-child{border-left:0}
.pre b{display:block;font-stretch:72%;font-weight:800;text-transform:uppercase;font-size:1.125rem;line-height:1.15;margin-top:4px}
@media (max-width:640px){.pre{grid-template-columns:1fr 1fr}.pre li:nth-child(3){border-left:0}.pre li:nth-child(n+3){border-top:1px solid var(--line)}}

/* stop 1: path */
.rev{border-top:1px solid var(--ink)}
.rev li{display:grid;grid-template-columns:2.2rem 7.2rem 1fr;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);min-height:2.7rem}
.rev .r{font-family:var(--mono);font-size:.75rem;color:var(--mag);font-weight:500}
.rev .d{font-family:var(--mono);font-size:.75rem;color:var(--grey)}
.rev .h{font-weight:700;line-height:1.3}
.rev li.e .h{color:var(--line);font-weight:400}
.rev li.new{animation:flash .6s ease}
@keyframes flash{from{background:var(--mag-soft)}to{background:transparent}}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{padding:10px 14px;border:1px solid var(--ink);background:var(--paper);font-weight:600;font-size:.9375rem;line-height:1.25;text-align:left;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease}
.chip:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--mag)}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
@media (max-width:520px){.rev li{grid-template-columns:1.6rem 1fr}.rev .d{grid-column:2;grid-row:2}.rev .h{grid-column:2}}

/* stop 2: chaos */
.tk{position:relative;max-width:24rem;margin:6px auto 30px}
.tk::before,.tk::after{content:"";position:absolute;inset:0;border:1px solid var(--ink);background:var(--paper-2)}
.tk::before{transform:rotate(-3deg) translate(-4px,5px)}
.tk::after{transform:rotate(2.2deg) translate(5px,3px)}
.tk.last::before,.tk.last::after{display:none}
.tk>div{position:relative;z-index:1;padding:16px 18px;border:1px solid var(--ink);background:#fff;transform:rotate(-.8deg)}
.tk b{display:block;margin-top:6px;font-size:1.125rem;line-height:1.3}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.col{display:flex;flex-direction:column;gap:8px;min-height:104px;padding:12px;border:1px solid var(--ink);background:var(--paper);text-align:left;cursor:pointer;transition:background-color .15s ease,color .15s ease}
@media (hover:hover){.col:hover:not(:disabled){background:var(--ink);color:var(--paper)}}
.col:disabled{cursor:default}
.col b{font-stretch:72%;font-weight:800;text-transform:uppercase;font-size:1.0625rem;line-height:1.1;hyphens:manual;overflow-wrap:anywhere}
.col .n{font-family:var(--mono);font-size:.6875rem;opacity:.7}
.col .bars{display:flex;flex-direction:column;gap:3px;margin-top:auto}
.col .bars i{display:block;height:5px;background:var(--mag);animation:grow .3s ease both}
@keyframes grow{from{transform:scaleX(0);transform-origin:left}to{transform:none;transform-origin:left}}
.auto{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:16px;padding:12px 14px;border:1px dashed var(--mag);background:var(--mag-soft)}
.auto p{flex:1 1 14rem;font-size:.9375rem}
@media (max-width:520px){.cols{gap:6px}.col{padding:10px 8px}.col b{font-size:.9375rem}}

/* stop 3: gloves */
.tab{position:relative;max-width:26rem;margin:0 auto;padding:14px;border:2px solid var(--ink);border-radius:14px;background:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.scrn{position:relative;min-height:264px;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:4px;background:#C9CCC4;overflow:hidden}
.scrn.b{background:#fff}
.do{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.do b{font-stretch:72%;font-weight:800;text-transform:uppercase;font-size:1.25rem;line-height:1.1}
.do b em{font-style:normal;color:var(--mag)}
.ga{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:auto}
.ga button{height:26px;padding:0;border:1px solid #8D9188;background:#B9BCB4;color:#55584F;font-size:.6875rem;cursor:pointer}
.gb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
.gb button{height:112px;padding:0;border:2px solid var(--ink);background:var(--paper);font-stretch:72%;font-weight:800;text-transform:uppercase;font-size:1.25rem;cursor:pointer}
.gb button.pri{background:var(--ink);color:#fff}
.stepb{padding:10px 12px;border-left:4px solid var(--mag);background:var(--paper);font-weight:600}
.ga button.hit,.gb button.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.ga button.miss,.gb button.miss{background:var(--mag);border-color:var(--mag);color:#fff}
.blob{position:absolute;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:rgba(214,0,111,.28);border:1.5px solid var(--mag);pointer-events:none;animation:blob .6s ease both}
@keyframes blob{from{transform:scale(.6);opacity:1}to{transform:scale(1.1);opacity:0}}
.mid{margin:auto 0;text-align:center}
.mid p{margin-bottom:14px;font-weight:600}
.cmp{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);margin-top:16px}
.cmp div{padding:14px 16px}
.cmp div+div{border-left:1px solid var(--ink);background:var(--ink);color:var(--paper)}
.cmp b{display:block;font-stretch:68%;font-weight:850;font-size:2.6rem;line-height:1}
.cmp div+div b{color:#FF4FA3}

/* stop 4: fact or bluff */
.q{margin-top:6px;font-size:clamp(1.25rem,3vw,1.625rem);font-weight:700;line-height:1.3;min-height:3.9em}
.fb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.fb .btn{min-height:64px;font-stretch:72%;font-weight:800;text-transform:uppercase;font-size:1.25rem}
.ans{margin-top:18px;padding:14px 16px;border-left:4px solid var(--ok);background:var(--paper-2)}
.ans.no{border-left-color:var(--mag)}
.ans b{display:block;margin-bottom:4px}
.dots{display:flex;gap:5px}
.dots i{width:18px;height:5px;background:var(--line)}
.dots i.y{background:var(--ok)}
.dots i.x{background:var(--mag)}
.dots i.c{background:var(--ink)}

/* unlocked facts */
.un{margin-top:24px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:clamp(18px,2.8vw,28px);animation:in .4s ease both}
.un .mono{color:#FF4FA3}
.un h3{margin:8px 0 10px;font-stretch:72%;font-weight:800;text-transform:uppercase;font-size:clamp(1.4rem,3.4vw,2rem);line-height:1.05}
.un p{max-width:40em}
.un p+p{margin-top:10px}
.un a{color:#FF4FA3;text-underline-offset:3px}
.un .res{margin-top:14px;padding-top:12px;border-top:1px solid rgba(242,243,239,.25);font-family:var(--mono);font-size:.8125rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:14px 0 4px}
.stats b{display:block;font-stretch:68%;font-weight:850;font-size:2.4rem;line-height:1;color:#FF4FA3}
.stats span{display:block;margin-top:4px;font-family:var(--mono);font-size:.6875rem;line-height:1.35;text-transform:uppercase;letter-spacing:.03em}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr}}
.un .btn{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.un .btn:hover{background:var(--mag);border-color:var(--mag);color:#fff}

/* report */
.rep{margin-top:26px;border:1px solid var(--ink);background:var(--paper)}
.rep .hd{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--ink);background:var(--ink);color:var(--paper)}
.rep dl{display:grid;grid-template-columns:1fr 1fr}
.rep dl>div{padding:12px 16px;border-bottom:1px solid var(--line)}
.rep dl>div:nth-child(odd){border-right:1px solid var(--line)}
.rep dt{font-family:var(--mono);font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mag);margin-bottom:2px}
.rep dd{font-weight:600;line-height:1.35}
.rep ul{padding:14px 16px;display:grid;gap:8px}
.rep ul li{display:grid;grid-template-columns:1.6rem 1fr;gap:6px}
.rep ul li::before{content:"✓";color:var(--ok);font-weight:800}
.rep ul li.sk::before{content:"·";color:var(--grey)}
.rep h3{padding:12px 16px 0;font-family:var(--mono);font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mag);font-weight:500}
@media (max-width:560px){.rep dl{grid-template-columns:1fr}.rep dl>div:nth-child(odd){border-right:0}}

footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px;padding:14px var(--gut);border-top:1px solid var(--ink);color:var(--grey)}
footer a{text-underline-offset:3px}
noscript p{max-width:880px;margin:0 auto;padding:20px;border:1px solid var(--ink);background:var(--paper)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header>
<div class="tb">
<a href="../" id="home"><small data-t="tbName">Name</small><b>Julia Wimmer</b></a>
<div><small data-t="tbDoc">Document</small><b data-t="tbDocV">Test drive</b></div>
<div><small data-t="tbDur">Duration</small><b data-t="tbDurV">About 3 minutes</b></div>
<div><small data-t="tbLang">Language</small><b class="lg" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button><button type="button" data-lang="de" aria-pressed="false" lang="de">DE</button></b></div>
</div>
<nav class="rt" aria-label="Progress"><ol id="rt"></ol></nav>
</header>

<main>
<div id="stage"></div>
<noscript><p>This little game needs JavaScript. Everything it shows is also on <a href="../">juliawimmer.de</a>.</p></noscript>
</main>

<footer class="mono">
<p>&#169; 2026 Julia Wimmer</p>
<p><a href="../" id="back" data-t="back">Back to juliawimmer.de</a></p>
</footer>

var L='en',S,stage=document.getElementById('stage'),rt=document.getElementById('rt');

function shuffle(n){var a=[],i,j,x;for(i=0;i<n;i++)a.push(i);
  do{for(i=n-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=a[i];a[i]=a[j];a[j]=x;}}while(a.every(function(v,k){return v===k;}));
  return a;}

    var c=i<S.scr||(i===S.scr&&S.scr===5)?'done':'';if(i===S.scr)c+=' cur';

}

function finish(n){S.done[n]=true;render(false);
  var u=stage.querySelector('.un');if(u){var r=u.getBoundingClientRect();
    if(r.top>window.innerHeight*0.6||r.top<0)window.scrollTo({top:r.top+window.pageYOffset-80,behavior:reduce?'auto':'smooth'});
    var b=u.querySelector('button');if(b)b.focus({preventScroll:true});}}

/* ---------- actions ---------- */
function shakeEl(el){if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
function autoRun(){
  var c=S.c,X=t('s2Tix');
  if(c.i>=X.length){c.running=false;c.msg='';finish(2);return;}
  c.counts[X[c.i][1]]++;c.i++;render(false);
  setTimeout(autoRun,reduce?0:260);
}
function gloveTap(e){
  var g=S.g,pad=document.getElementById('pad'),scrn=document.getElementById('scrn');if(!pad||g.mid||g.lock)return;
  var btn=null,x,y;
  if(e.detail===0&&e.target.closest('[data-g]')){btn=e.target.closest('[data-g]');} // keyboard: no glove
  else{
    var a=Math.random()*Math.PI*2,r=34*Math.sqrt(Math.random());x=e.clientX+Math.cos(a)*r;y=e.clientY+Math.sin(a)*r;
    var sr=scrn.getBoundingClientRect(),bl=document.createElement('span');bl.className='blob';bl.style.left=(x-sr.left)+'px';bl.style.top=(y-sr.top)+'px';
    scrn.appendChild(bl);setTimeout(function(){if(bl.parentNode)bl.parentNode.removeChild(bl);},650);
    Array.prototype.forEach.call(pad.querySelectorAll('[data-g]'),function(b){var q=b.getBoundingClientRect();if(x>=q.left&&x<=q.right&&y>=q.top&&y<=q.bottom)btn=b;});
  }
  var ok=btn&&btn.getAttribute('data-g')===t('s3Targets')[g.task],st=stage.querySelector('.st');
  function say(m,bad){g.msg=m;g.bad=bad;if(st){st.textContent=m;st.className='st mono '+(bad?'bad':'good');}}
  if(btn)btn.classList.add(ok?'hit':'miss');
  if(ok){say(t('s3Hit'),false);}
  else{g.tm++;if(g.ver==='A')g.missA++;else g.missB++;
    if(g.tm<3){say(t('s3Miss'),true);if(btn)setTimeout(function(){btn.classList.remove('miss');},350);shakeEl(pad);return;}
    say(t('s3Give'),true);}
  g.lock=true;
  setTimeout(function(){g.lock=false;g.tm=0;g.task++;
    if(g.task>2){if(g.ver==='A'){g.mid=true;g.msg='';render(false);var b=stage.querySelector('[data-a="verB"]');if(b)b.focus({preventScroll:true});}else{g.msg='';finish(3);}}
    else render(false);
  },ok?450:900);
}
stage.addEventListener('click',function(e){
  var el=e.target.closest('button,a');
  if(S.scr===3&&!S.done[3]&&e.target.closest('#scrn')&&!(el&&el.hasAttribute('data-a'))){gloveTap(e);return;}
  if(!el||el.tagName==='A')return;
  var a=el.getAttribute('data-a');
  if(a==='next'){S.scr=Math.min(5,S.scr+1);render(true);return;}
  if(a==='again'){reset();render(true);return;}
  if(a==='skip'){S.skip[S.scr]=true;if(S.scr===1)S.p.n=6;finish(S.scr);return;}
  if(a==='auto'){S.c.auto=true;S.c.running=true;S.c.bad=false;S.c.msg=t('s2Running');autoRun();return;}
  if(a==='verB'){var g=S.g;g.ver='B';g.task=0;g.tm=0;g.mid=false;g.msg='';render(false);return;}
  if(a==='q'){var b=S.b;if(b.i<t('s4Q').length-1){b.i++;b.ans=null;render(false);var q=stage.querySelector('[data-f]');if(q)q.focus({preventScroll:true});}else finish(4);return;}
  if(el.hasAttribute('data-p')){var p=S.p,i=+el.getAttribute('data-p');
    if(i===p.n){p.n++;p.bad=false;p.msg=t('s1Good')(p.n);if(p.n===6){p.msg='';finish(1);}else{render(false);var c=stage.querySelector('.chip');if(c)c.focus({preventScroll:true});}}
    else{p.miss++;p.bad=true;p.msg=t('s1Bad');var st=stage.querySelector('.st');if(st){st.textContent=p.msg;st.className='st mono bad';}shakeEl(el);}
    return;}
  if(el.hasAttribute('data-c')){var c2=S.c,X=t('s2Tix'),k=+el.getAttribute('data-c');if(c2.running||c2.i>=X.length)return;
    if(k===X[c2.i][1]){c2.counts[k]++;c2.i++;c2.hand++;c2.bad=false;c2.msg=t('s2Good');
      if(c2.i>=X.length){c2.msg='';finish(2);}else{render(false);var nb=stage.querySelector('[data-c="'+k+'"]');if(nb)nb.focus({preventScroll:true});}}
    else{c2.bad=true;c2.msg=t('s2Bad');var s2t=stage.querySelector('.st');if(s2t){s2t.textContent=c2.msg;s2t.className='st mono bad';}shakeEl(stage.querySelector('.tk'));}
    return;}
  if(el.hasAttribute('data-f')){var bb=S.b,q2=t('s4Q')[bb.i],ok=(el.getAttribute('data-f')==='1')===q2[1];
    bb.ans=ok;bb.res.push(ok);if(ok)bb.right++;render(false);var n2=stage.querySelector('[data-a="q"]');if(n2)n2.focus({preventScroll:true});return;}
});
Array.prototype.forEach.call(document.querySelectorAll('.lg button'),function(b){b.addEventListener('click',function(){
  var l=b.getAttribute('data-lang');if(l===L)return;L=l;
  // messages are stored as text, so clear them on a language switch
  S.p.msg=S.c.running?S.p.msg:'';if(!S.c.running)S.c.msg='';else S.c.msg=t('s2Running');S.g.msg='';S.p.msg='';
  render(false);});});
if(/[?&]lang=de\b/.test(location.search))L='de';
render(false);
})();
</script>
</body>
</html>
