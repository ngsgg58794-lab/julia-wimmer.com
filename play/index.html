<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game: Get to know Julia · Julia Wimmer</title>
<meta name="description" content="A small 3D game for recruiters: drive along Julia Wimmer's path and collect 30 facts about her. Julia is a UX and product designer with a focus on digitalization and AI.">
<meta property="og:title" content="Game: Get to know Julia">
<meta property="og:description" content="A small 3D game for recruiters: drive along Julia's path and collect 30 facts about her.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://juliawimmer.de/img/portrait.jpeg">
<meta name="theme-color" content="#F2F3EF">
<link rel="icon" href="../favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="../favicon.png?v=2" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
/* Same data-sheet look as the main page: one ink, one process magenta, a measuring grid. */
:root{
  --paper:#F2F3EF; --paper-2:#E7E9E3; --ink:#0E0F0C; --grey:#55584F; --line:rgba(14,15,12,.16);
  --mag:#D6006F; --mag-soft:rgba(214,0,111,.12); --ok:#0B6B3A;
  --gut:clamp(16px,4.4vw,72px);
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'Archivo',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.55;overflow-x:clip}
h1,h2,h3,p,ol,ul,dl,dd{margin:0}
ol,ul{padding:0;list-style:none}
a{color:inherit}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--mag);outline-offset:3px}
[tabindex="-1"]:focus{outline:0}
::selection{background:var(--mag);color:#fff}
.mono{font-family:var(--mono);font-size:.75rem;line-height:1.4;letter-spacing:.04em;text-transform:uppercase;font-weight:500}
.m{color:var(--mag)}
.grey{color:var(--grey)}

/* title block */
.tb{display:grid;grid-template-columns:1.2fr 1.4fr 1fr .8fr;border-bottom:1px solid var(--ink)}
.tb>*{padding:12px 16px;border-left:1px solid var(--ink);min-width:0}
.tb>*:first-child{border-left:0;padding-left:var(--gut)}
.tb>*:last-child{padding-right:var(--gut)}
.tb small{display:block;font-family:var(--mono);font-size:.625rem;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);margin-bottom:2px}
.tb b{display:block;font-weight:700;font-size:.9375rem;line-height:1.25}
.tb a{text-decoration:none}
.tb a:hover b{color:var(--mag)}
.lg{display:flex!important;margin-top:3px}
.lg button{min-width:2.6rem;padding:3px 10px;border:1px solid var(--ink);background:none;font-family:var(--mono);font-size:.75rem;font-weight:500;cursor:pointer}
.lg button+button{margin-left:-1px}
.lg button:hover{background:var(--ink);color:var(--paper)}
.lg button[aria-pressed="true"]{background:var(--mag);border-color:var(--mag);color:#fff;position:relative}
@media (max-width:720px){
  .tb{grid-template-columns:1fr 1fr}
  .tb>*:nth-child(3){border-left:0;padding-left:var(--gut)}
  .tb>*:nth-child(n+3){border-top:1px solid var(--ink)}
  .tb>*:nth-child(2){padding-right:var(--gut)}
  .tb b{font-size:.8125rem}
}

/* route = progress */
.rt{padding:18px var(--gut) 14px;border-bottom:1px solid var(--ink)}
.rt ol{position:relative;display:flex;justify-content:space-between;max-width:880px;margin:0 auto}
.rt ol::before{content:"";position:absolute;left:8px;right:8px;top:7px;height:2px;background:repeating-linear-gradient(90deg,var(--ink) 0 10px,transparent 10px 16px)}
.rt li{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:16px;white-space:nowrap}
.rt li:first-child{align-items:flex-start}
.rt li:last-child{align-items:flex-end}
.rt i{display:block;width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);transition:background-color .25s ease,border-color .25s ease,transform .25s ease}
.rt li.done i{background:var(--ink)}
.rt li.cur i{background:var(--mag);border-color:var(--mag);transform:scale(1.25)}
.rt li.cur span{color:var(--mag)}
@media (max-width:560px){.rt li:not(:first-child):not(:last-child):not(.cur) span{visibility:hidden}}

/* stage */
main{flex:1;padding:clamp(28px,4.5vw,56px) var(--gut) 64px;
  background-image:linear-gradient(rgba(14,15,12,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(14,15,12,.06) 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px}
#stage{max-width:880px;margin:0 auto}
.scr{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kick{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.kick::before{content:"";width:28px;height:1px;background:var(--mag)}
h1,h2.big{font-size:clamp(2.2rem,6.4vw,4.4rem);line-height:.9;font-stretch:68%;font-weight:850;text-transform:uppercase;letter-spacing:-.012em}
h2.big{font-size:clamp(1.8rem,4.6vw,3rem)}
.lead{max-width:36em;margin-top:18px;font-size:1.0625rem}
.task{max-width:38em;margin-top:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:0 22px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700;text-decoration:none;cursor:pointer;transition:background-color .15s ease,border-color .15s ease,color .15s ease}
.btn:hover{background:var(--mag);border-color:var(--mag)}
.btn.mag{background:var(--mag);border-color:var(--mag);color:#fff}
.btn.mag:hover{background:var(--ink);border-color:var(--ink)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn svg{flex:none}
.lnk{background:none;border:0;padding:8px 0;font-family:var(--mono);font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;font-weight:500;color:var(--grey);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.lnk:hover{color:var(--mag)}
.card{margin-top:24px;padding:clamp(16px,2.6vw,26px);border:1px solid var(--ink);background:var(--paper)}
.st{min-height:1.4em;margin-top:14px;color:var(--grey)}
.st.bad{color:var(--mag)}
.st.good{color:var(--ok)}
.note{margin-top:10px;color:var(--grey)}
.shake{animation:shake .3s ease}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* intro */
.pre{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:30px;border:1px solid var(--ink);background:var(--paper)}
.pre li{padding:14px 16px;border-left:1px solid var(--line)}
.pre li:first-child{border-left:0}
.pre b{display:block;font-stretch:72%;font-weight:800;text-transform:uppercase;font-size:1.125rem;line-height:1.15;margin-top:4px}
@media (max-width:640px){.pre{grid-template-columns:1fr 1fr}.pre li:nth-child(3){border-left:0}.pre li:nth-child(n+3){border-top:1px solid var(--line)}}

/* stop 1: path */
.rev{border-top:1px solid var(--ink)}
.rev li{display:grid;grid-template-columns:2.2rem 7.2rem 1fr;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);min-height:2.7rem}
.rev .r{font-family:var(--mono);font-size:.75rem;color:var(--mag);font-weight:500}
.rev .d{font-family:var(--mono);font-size:.75rem;color:var(--grey)}
.rev .h{font-weight:700;line-height:1.3}
.rev li.e .h{color:var(--line);font-weight:400}
.rev li.new{animation:flash .6s ease}
@keyframes flash{from{background:var(--mag-soft)}to{background:transparent}}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{padding:10px 14px;border:1px solid var(--ink);background:var(--paper);font-weight:600;font-size:.9375rem;line-height:1.25;text-align:left;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease}
.chip:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--mag)}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
@media (max-width:520px){.rev li{grid-template-columns:1.6rem 1fr}.rev .d{grid-column:2;grid-row:2}.rev .h{grid-column:2}}

/* stop 2: chaos */
.tk{position:relative;max-width:24rem;margin:6px auto 30px}
.tk::before,.tk::after{content:"";position:absolute;inset:0;border:1px solid var(--ink);background:var(--paper-2)}
.tk::before{transform:rotate(-3deg) translate(-4px,5px)}
.tk::after{transform:rotate(2.2deg) translate(5px,3px)}
.tk.last::before,.tk.last::after{display:none}
.tk>div{position:relative;z-index:1;padding:16px 18px;border:1px solid var(--ink);background:#fff;transform:rotate(-.8deg)}
.tk b{display:block;margin-top:6px;font-size:1.125rem;line-height:1.3}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.col{display:flex;flex-direction:column;gap:8px;min-height:104px;padding:12px;border:1px solid var(--ink);background:var(--paper);text-align:left;cursor:pointer;transition:background-color .15s ease,color .15s ease}
@media (hover:hover){.col:hover:not(:disabled){background:var(--ink);color:var(--paper)}}
.col:disabled{cursor:default}
.col b{font-stretch:72%;font-weight:800;text-transform:uppercase;font-size:1.0625rem;line-height:1.1;hyphens:manual;overflow-wrap:anywhere}
.col .n{font-family:var(--mono);font-size:.6875rem;opacity:.7}
.col .bars{display:flex;flex-direction:column;gap:3px;margin-top:auto}
.col .bars i{display:block;height:5px;background:var(--mag);animation:grow .3s ease both}
@keyframes grow{from{transform:scaleX(0);transform-origin:left}to{transform:none;transform-origin:left}}
.auto{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:16px;padding:12px 14px;border:1px dashed var(--mag);background:var(--mag-soft)}
.auto p{flex:1 1 14rem;font-size:.9375rem}
@media (max-width:520px){.cols{gap:6px}.col{padding:10px 8px}.col b{font-size:.9375rem}}

/* stop 3: gloves */
.tab{position:relative;max-width:26rem;margin:0 auto;padding:14px;border:2px solid var(--ink);border-radius:14px;background:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.scrn{position:relative;min-height:264px;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:4px;background:#C9CCC4;overflow:hidden}
.scrn.b{background:#fff}
.do{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.do b{font-stretch:72%;font-weight:800;text-transform:uppercase;font-size:1.25rem;line-height:1.1}
.do b em{font-style:normal;color:var(--mag)}
.ga{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:auto}
.ga button{height:26px;padding:0;border:1px solid #8D9188;background:#B9BCB4;color:#55584F;font-size:.6875rem;cursor:pointer}
.gb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
.gb button{height:112px;padding:0;border:2px solid var(--ink);background:var(--paper);font-stretch:72%;font-weight:800;text-transform:uppercase;font-size:1.25rem;cursor:pointer}
.gb button.pri{background:var(--ink);color:#fff}
.stepb{padding:10px 12px;border-left:4px solid var(--mag);background:var(--paper);font-weight:600}
.ga button.hit,.gb button.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.ga button.miss,.gb button.miss{background:var(--mag);border-color:var(--mag);color:#fff}
.blob{position:absolute;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:rgba(214,0,111,.28);border:1.5px solid var(--mag);pointer-events:none;animation:blob .6s ease both}
@keyframes blob{from{transform:scale(.6);opacity:1}to{transform:scale(1.1);opacity:0}}
.mid{margin:auto 0;text-align:center}
.mid p{margin-bottom:14px;font-weight:600}
.cmp{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);margin-top:16px}
.cmp div{padding:14px 16px}
.cmp div+div{border-left:1px solid var(--ink);background:var(--ink);color:var(--paper)}
.cmp b{display:block;font-stretch:68%;font-weight:850;font-size:2.6rem;line-height:1}
.cmp div+div b{color:#FF4FA3}

/* stop 4: fact or bluff */
.q{margin-top:6px;font-size:clamp(1.25rem,3vw,1.625rem);font-weight:700;line-height:1.3;min-height:3.9em}
.fb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.fb .btn{min-height:64px;font-stretch:72%;font-weight:800;text-transform:uppercase;font-size:1.25rem}
.ans{margin-top:18px;padding:14px 16px;border-left:4px solid var(--ok);background:var(--paper-2)}
.ans.no{border-left-color:var(--mag)}
.ans b{display:block;margin-bottom:4px}
.dots{display:flex;gap:5px}
.dots i{width:18px;height:5px;background:var(--line)}
.dots i.y{background:var(--ok)}
.dots i.x{background:var(--mag)}
.dots i.c{background:var(--ink)}

/* unlocked facts */
.un{margin-top:24px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:clamp(18px,2.8vw,28px);animation:in .4s ease both}
.un .mono{color:#FF4FA3}
.un h3{margin:8px 0 10px;font-stretch:72%;font-weight:800;text-transform:uppercase;font-size:clamp(1.4rem,3.4vw,2rem);line-height:1.05}
.un p{max-width:40em}
.un p+p{margin-top:10px}
.un a{color:#FF4FA3;text-underline-offset:3px}
.un .res{margin-top:14px;padding-top:12px;border-top:1px solid rgba(242,243,239,.25);font-family:var(--mono);font-size:.8125rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:14px 0 4px}
.stats b{display:block;font-stretch:68%;font-weight:850;font-size:2.4rem;line-height:1;color:#FF4FA3}
.stats span{display:block;margin-top:4px;font-family:var(--mono);font-size:.6875rem;line-height:1.35;text-transform:uppercase;letter-spacing:.03em}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr}}
.un .btn{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.un .btn:hover{background:var(--mag);border-color:var(--mag);color:#fff}

/* report */
.rep{margin-top:26px;border:1px solid var(--ink);background:var(--paper)}
.rep .hd{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--ink);background:var(--ink);color:var(--paper)}
.rep dl{display:grid;grid-template-columns:1fr 1fr}
.rep dl>div{padding:12px 16px;border-bottom:1px solid var(--line)}
.rep dl>div:nth-child(odd){border-right:1px solid var(--line)}
.rep dt{font-family:var(--mono);font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mag);margin-bottom:2px}
.rep dd{font-weight:600;line-height:1.35}
.rep ul{padding:14px 16px;display:grid;gap:8px}
.rep ul li{display:grid;grid-template-columns:1.6rem 1fr;gap:6px}
.rep ul li::before{content:"✓";color:var(--ok);font-weight:800}
.rep ul li.sk::before{content:"·";color:var(--grey)}
.rep h3{padding:12px 16px 0;font-family:var(--mono);font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mag);font-weight:500}
@media (max-width:560px){.rep dl{grid-template-columns:1fr}.rep dl>div:nth-child(odd){border-right:0}}

footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px;padding:14px var(--gut);border-top:1px solid var(--ink);color:var(--grey)}
footer a{text-underline-offset:3px}
noscript p{max-width:880px;margin:0 auto;padding:20px;border:1px solid var(--ink);background:var(--paper)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- 3D version: canvas, HUD and overlay ---------- */
html,body{height:100%}
body{display:block;overflow:hidden;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:0;cursor:crosshair}
.no3d #c{display:none}
.hud{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--paper)}
.hud .tb{grid-template-columns:1.2fr 1fr 1fr .9fr}
.hud .tb b{font-variant-numeric:tabular-nums}
@media (max-width:720px){
  .hud .tb{grid-template-columns:1.25fr 1fr 1fr auto}
  .hud .tb>*{padding:8px 10px;border-top:0!important;border-left:1px solid var(--ink)!important}
  .hud .tb>*:first-child{border-left:0!important;padding-left:14px}
  .hud .tb>*:last-child{padding-right:12px}
  .hud .tb small{font-size:.5625rem;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lg button{min-width:2rem;padding:3px 6px}
}
.nx{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:10px;padding:8px 14px;border:1px solid var(--ink);background:var(--paper);white-space:nowrap}
.nx #arr{display:inline-block;color:var(--mag);font-size:1.125rem;line-height:1;font-family:var(--sans);font-weight:800}
.hint{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:4;max-width:calc(100% - 32px);padding:10px 14px;background:var(--ink);color:var(--paper);text-align:center}
.bub{position:fixed;left:50%;bottom:49%;transform:translateX(-50%);z-index:5;width:max-content;max-width:min(360px,calc(100% - 40px));padding:12px 22px 14px;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:30px;font-weight:700;font-size:17px;line-height:1.3;text-align:center;box-shadow:4px 4px 0 var(--ink);pointer-events:none;animation:bub .28s ease-out}
.bub small{display:block;margin-bottom:3px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--mag)}
.bub::before,.bub::after{content:"";position:absolute;left:50%;background:#fff;border:2px solid var(--ink);border-radius:50%}
.bub::before{width:16px;height:16px;bottom:-26px;margin-left:-16px}
.bub::after{width:9px;height:9px;bottom:-41px;margin-left:-5px}
@keyframes bub{from{opacity:0;transform:translateX(-50%) translateY(10px) scale(.92)}to{opacity:1;transform:translateX(-50%)}}
.toast{position:fixed;left:50%;top:124px;transform:translateX(-50%);z-index:6;max-width:calc(100% - 32px);padding:12px 16px;background:var(--mag);color:#fff;font-weight:700;text-align:center}
.dock{position:fixed;right:16px;bottom:16px;z-index:4;display:flex;gap:8px}
.dock .btn{min-height:46px;padding:0 16px;font-size:.9375rem}
[hidden]{display:none!important}
#ov{position:fixed;inset:0;z-index:10;display:flex;overflow:auto;padding:76px 16px 24px;background:rgba(242,243,239,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.no3d #ov{background:var(--paper)}
.pan{width:100%;max-width:720px;margin:auto;padding:clamp(20px,3.4vw,36px);border:1px solid var(--ink);background:var(--paper);box-shadow:8px 8px 0 var(--ink);animation:in .3s ease both}
.pan h1{font-size:clamp(2rem,5.6vw,3.6rem)}
.pan h2.big{font-size:clamp(1.6rem,4.2vw,2.5rem);line-height:.95}
.lead2{max-width:36em;margin-top:10px;font-weight:700}
.pan a.lnk{text-decoration:underline}
.apps{display:grid;grid-template-columns:1fr 1fr;margin-top:20px;border:1px solid var(--ink)}
.apps li{padding:12px 14px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.apps li:nth-child(-n+2){border-top:0}.apps li:nth-child(odd){border-left:0}
.apps b{display:block;font-stretch:72%;font-weight:800;text-transform:uppercase;font-size:1.125rem}
.apps span{display:block;font-size:.9375rem;line-height:1.4;color:var(--grey)}
@media (max-width:520px){.apps{grid-template-columns:1fr}.apps li{border-left:0}.apps li:nth-child(2){border-top:1px solid var(--line)}}
.fhead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.fhead .kick{margin:0}.fhead .kick::before{display:none}
.gly{display:grid;place-items:center;flex:none;width:56px;height:56px;background:var(--mag);color:#fff;font-stretch:72%;font-weight:800;font-size:1.375rem;box-shadow:4px 4px 0 var(--ink);transform:rotate(-4deg)}
.q{min-height:0}
.pan .dots{flex-wrap:wrap;justify-content:flex-end}.pan .dots i{width:12px}
.ls{margin-top:18px;border-top:1px solid var(--ink)}
.ls button{display:grid;grid-template-columns:3.4rem 1fr 1.4rem;gap:10px;align-items:baseline;width:100%;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.ls button:hover:not(:disabled){background:var(--ink);color:var(--paper)}

let S,W=null; // W = 3D world, null when 3D is not available
function reset(){S={panel:{t:'intro'},started:false,seen:{},found:{},allToast:false};}
reset();
const nSeen=()=>ST.filter(s=>S.seen[s.id]).length;
const nFound=()=>Object.keys(S.found).length;
const nArea=k=>{let n=0;for(let i=0;i<NF;i++)if(AR[i]===k&&S.found[i])n++;return n;};
const tArea=k=>AR.split(k).length-1;
const nextF=()=>{for(let i=0;i<NF;i++)if(!S.found[i])return i;return -1;};
const allDone=()=>nSeen()===ST.length&&nFound()===NF;

/* ---------- panels ---------- */
const ov=$('#ov'),pan=$('#pan');
function status(o){return '<p class="st mono'+(o.msg?(o.bad?' bad':' good'):'')+'" role="status">'+esc(o.msg||'')+'</p>';}
function foot(id,primary){
  const l=id&&t('lnk')[id];
  return '<div class="row">'+(primary||'<button class="btn mag" type="button" data-a="close">'+esc(W?t('drive'):t('list'))+' '+ARROW+'</button>')+
    (W?'<button class="lnk" type="button" data-a="list">'+esc(t('list'))+'</button>':'')+
    (l?'<a class="lnk" href="'+site(l[1])+'" target="_blank" rel="noopener">'+esc(l[0])+' ↗</a>':'')+'</div>';
}
function pIntro(){
  return '<p class="kick mono m">'+esc(t('iKick'))+'</p><h1 tabindex="-1" id="h">'+t('iH')+'</h1><p class="lead">'+esc(t('iLead'))+'</p>'+
    (W?'<ol class="pre">'+t('iHow').map(p=>'<li><span class="mono m">'+esc(p[0])+'</span><b>'+esc(p[1])+'</b></li>').join('')+'</ol>':'<p class="note">'+esc(t('iNo3d'))+'</p>')+
    '<div class="row">'+(W?'<button class="btn mag" type="button" data-a="start">'+esc(t('iStart'))+' '+ARROW+'</button><button class="lnk" type="button" data-a="list">'+esc(t('iList'))+'</button>'
      :'<button class="btn mag" type="button" data-a="list">'+esc(t('list'))+' '+ARROW+'</button>')+'</div>';
}
function pStation(id){
  const s=t('st')[id],k=ST.find(x=>x.id===id).k;
  let h='<p class="kick mono m">'+esc(t('rev'))+' '+k+' · '+esc(s[0])+'</p><h2 class="big" tabindex="-1" id="h">'+esc(s[1])+'</h2>';
  h+='<p class="lead">'+esc(s[2])+'</p>'+(s[3]?'<p class="lead2">'+esc(s[3])+'</p>':'');
  if(id==='f')h+='<ul class="apps">'+t('apps').map(a=>'<li><b>'+esc(a[0])+'</b><span>'+esc(a[1])+'</span></li>').join('')+'</ul>';
  return h+foot(id);
}
function pF(i){
  const f=t('F')[i],more=nextF()>=0&&(!W||!S.started)?'<button class="btn ghost" type="button" data-a="nextf">'+esc(t('fNext'))+'</button>':'';
  return '<div class="fhead"><span class="gly" aria-hidden="true">'+esc(GLYPH[i])+'</span><p class="kick mono m">'+esc(t('fKick')(nFound(),NF))+' · '+esc(f[0])+'</p></div><h2 class="big" tabindex="-1" id="h">'+esc(f[1])+'</h2><p class="lead">'+esc(f[2]||f[3])+'</p>'+
    '<div class="row"><button class="btn mag" type="button" data-a="close">'+esc(W?t('drive'):t('list'))+' '+ARROW+'</button>'+more+'</div>';
}
function pList(){
  const nq=nextF();
  return '<p class="kick mono m">'+nSeen()+' / '+ST.length+' · '+nFound()+' / '+NF+'</p><h2 class="big" tabindex="-1" id="h">'+esc(t('lH'))+'</h2><p class="task">'+esc(t('lLead'))+'</p>'+
    '<ul class="ls">'+ST.map(s=>'<li><button type="button" data-st="'+s.id+'"><span class="mono m">'+s.k+'</span><b>'+esc(t('st')[s.id][1])+'</b><span class="ck" aria-hidden="true">'+(S.seen[s.id]?'✓':'')+'</span></button></li>').join('')+
    '<li><button type="button" data-a="nextf"'+(nq<0?' disabled':'')+'><span class="mono m">+</span><b>'+esc(nq<0?t('lQDone'):t('lQ')(nFound(),NF))+'</b><span class="ck" aria-hidden="true">'+(nq<0?'✓':'')+'</span></button></li></ul>'+
    '<div class="row"><button class="btn" type="button" data-a="rep">'+esc(t('rep'))+' '+ARROW+'</button>'+(W&&S.started?'<button class="btn ghost" type="button" data-a="close">'+esc(t('back'))+'</button>':W?'<button class="btn ghost" type="button" data-a="start">'+esc(t('iStart'))+'</button>':'')+'</div>';
}
function pReport(){
  const full=allDone(),log=[t('rL1')(nSeen(),ST.length),t('rL2')(nFound(),NF)].concat(['b','d','t','p'].map(k=>t('arOf')(t('ar')[k],nArea(k),tArea(k))));
  return '<p class="kick mono m">'+esc(S.panel.gate?t('rKickA'):t('rKickB'))+'</p><h1 tabindex="-1" id="h">'+(full?t('rH'):t('rHPart'))+'</h1><p class="lead">'+esc(t('rLead'))+'</p>'+
    '<div class="row"><a class="btn mag" href="mailto:mail@juliawimmer.de?subject='+encodeURIComponent(t('rSubject'))+'">'+esc(t('rMail'))+' '+ARROW+'</a>'+

    '<a class="btn ghost" href="'+site()+'">'+esc(t('rSite'))+'</a></div>'+

function panelHTML(){const p=S.panel;return p.t==='intro'?pIntro():p.t==='st'?pStation(p.id):p.t==='f'?pF(p.i):p.t==='list'?pList():pReport();}
function shell(){
  document.documentElement.lang=L;document.title=t('title');
  document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.getAttribute('data-t'));});
  document.querySelectorAll('.lg button').forEach(b=>b.setAttribute('aria-pressed',b.getAttribute('data-lang')===L?'true':'false'));
  $('#home').href=site();$('#c').setAttribute('aria-label',t('canvas'));
  $('#hs').textContent=nSeen()+' / '+ST.length;$('#hb').textContent=nFound()+' / '+NF;
  $('#bList').textContent=t('list');$('#bRep').textContent=t('rep');$('#hint').textContent=t('hint');
  const live=!!W&&S.started;$('#dock').hidden=!live;$('#nx').hidden=!live;
}
function render(focus){
  shell();
  const open=!!S.panel;ov.hidden=!open;document.body.classList.toggle('open',open);
  if(!open){pan.innerHTML='';return;}
  pan.innerHTML=panelHTML();pan.className='pan';
  if(focus){pan.scrollTop=0;ov.scrollTop=0;const h=$('#h');if(h)h.focus({preventScroll:true});}
}
function openPanel(p){if(p.t==='st')S.seen[p.id]=true;if(p.t==='f')S.found[p.i]=true;S.panel=p;hideBub();if(W)W.stop();render(true);if(W)W.sync();}
function closePanel(){
  if(!W||!S.started){S.panel={t:S.started||!W?'list':'intro'};render(true);return;}
  S.panel=null;render(false);W.sync();$('#c').focus({preventScroll:true});
  if(allDone()&&!S.allToast){S.allToast=true;toast(t('toastAll'));}
}
let toastT;function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{e.hidden=true;},5200);}
let bubT;function hideBub(){clearTimeout(bubT);$('#bub').hidden=true;}
// while driving nothing opens a panel: boxes and stations answer with a short thought bubble above the motorcycle
function bubble(kick,text,ms){const e=$('#bub');$('#toast').hidden=true;e.hidden=true;e.innerHTML='<small class="mono">'+esc(kick)+'</small>'+esc(text);void e.offsetWidth;e.hidden=false;
  clearTimeout(bubT);bubT=setTimeout(()=>{e.hidden=true;},ms);}
function later(key,msg){if(S[key])return;S[key]=true;const s0=S;setTimeout(()=>{if(S===s0&&!S.panel){hideBub();toast(msg);}},3200);}
function collect(i){S.found[i]=true;shell();if(W)W.sync();const k=AR[i];bubble(t('arOf')(t('ar')[k],nArea(k),tArea(k))+(nArea(k)===tArea(k)?' ✓':''),t('F')[i][3],3000);
  if(allDone())later('allToast',t('toastAll'));}
function visit(id){const k=ST.find(x=>x.id===id).k;S.seen[id]=true;shell();if(W)W.sync();
  bubble(t('rev')+' '+k+' · '+t('st')[id][0],t('sb')[id],3000);
  if(allDone())later('allToast',t('toastAll'));}

/* ---------- panel actions ---------- */
pan.addEventListener('click',e=>{
  const el=e.target.closest('button,a');
  if(!el||el.tagName==='A')return;
  const a=el.getAttribute('data-a');
  if(a==='start'){S.started=true;S.panel=null;render(false);W.sync();$('#c').focus({preventScroll:true});const h=$('#hint');h.hidden=false;setTimeout(()=>{h.hidden=true;},7000);return;}
  if(a==='close'){closePanel();return;}
  if(a==='list'){openPanel({t:'list'});return;}
  if(a==='rep'){openPanel({t:'rep'});return;}
  if(a==='again'){reset();hideBub();if(W){W.reset();}render(true);return;}
  if(a==='nextf'){const i=nextF();if(i>=0)openPanel({t:'f',i});return;}
  if(el.hasAttribute('data-st')){openPanel({t:'st',id:el.getAttribute('data-st')});return;}
});
$('#bList').addEventListener('click',()=>openPanel({t:'list'}));
$('#bRep').addEventListener('click',()=>openPanel({t:'rep'}));
document.querySelectorAll('.lg button').forEach(b=>b.addEventListener('click',()=>{
  const l=b.getAttribute('data-lang');if(l===L)return;L=l;
  hideBub();render(false);}));
addEventListener('keydown',e=>{if(e.key==='Escape'&&S.panel&&S.started&&W)closePanel();});

  // boxes: floating cubes, each with its own sign

    const x=FP[i][0],z=FP[i][1];

    const d=new THREE.Mesh(new THREE.CircleGeometry(a.r,56),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.1,depthWrite:false}));d.rotation.x=-Math.PI/2;d.position.set(a.x,.02,a.z);scene.add(d);

    const c=document.createElement('canvas');c.width=512;c.height=232;const g=c.getContext('2d'),tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx}));sp.scale.set(13,13*232/512,1);sp.position.set(a.x,10.5,a.z);scene.add(sp);
    cyl(.12,.12,8,6,INK,a.x,4,a.z);
    let last=-1;const draw=n=>{if(n===last)return;last=n;const tot=tArea(k);g.fillStyle=a.c;g.fillRect(0,0,512,232);g.strokeStyle='#F2F3EF';g.lineWidth=8;g.strokeRect(10,10,492,212);

    box(6,7,9,PAPER2,0,3.5,-6,g);const lb=label('MUC','MUNICH',8);lb.position.set(0,21,0);g.add(lb);}
  {const g=new THREE.Group();g.position.set(GATE.x,0,GATE.z);scene.add(g);
    box(1.2,9,1.2,MAG,-6,4.5,0,g);box(1.2,9,1.2,MAG,6,4.5,0,g);box(14.4,1.6,1.4,MAG,0,9.4,0,g);
    const lb=label('INN','TEST REPORT',9);lb.position.set(0,13.4,0);g.add(lb);
    for(let i=0;i<8;i++){const x=(i<4?-1:1)*(11+rnd()*22),z=-6-rnd()*10,h=3+rnd()*3;box(4,h,4,WHITE,x,h/2,z,g);const r=cyl(0,3.3,2.4,4,i%2?MAG:INK,x,h+1.2,z,g);r.rotation.y=Math.PI/4;}}
  const mount=(x,z,r,h)=>{const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,6),M(0xC9CDC3));m.position.set(x,h/2-.5,z);m.rotation.y=rnd()*3;scene.add(m);
    if(h>26){const c=new THREE.Mesh(new THREE.ConeGeometry(r*.34,h*.33,6),M(WHITE));c.position.set(x,h-h*.165-.3,z);c.rotation.y=m.rotation.y;c.scale.setScalar(1.04);scene.add(c);}};
  for(let i=0;i<17;i++){const x=-96+i*12+(rnd()-.5)*8;mount(x,-138-rnd()*26-Math.abs(x)*.05,17+rnd()*12,30+rnd()*28);}
  for(let i=0;i<15;i++){const z=-118+i*21,f=Math.max(0,1-i/11);[-1,1].forEach(s=>mount(s*(84+rnd()*14),z+(rnd()-.5)*10,12+rnd()*8*f+4,8+30*f*f+rnd()*6));}
  {const N=170,cone=new THREE.InstancedMesh(new THREE.ConeGeometry(1.25,3.8,6),M(TREE),N),trunk=new THREE.InstancedMesh(new THREE.CylinderGeometry(.22,.22,1.2,5),M(INK),N),o=new THREE.Object3D();let n=0,guard=0;
    while(n<N&&guard++<4000){const x=-74+rnd()*148,z=-116+rnd()*(ZMAX+112);
      if(roadDist(x,z)<10||ST.some(s=>Math.hypot(s.x-x,s.z-z)<s.r+9)||tokens.some(q=>Math.hypot(q.x-x,q.z-z)<4)||(z<-98&&Math.abs(x)<34)||Math.hypot(x-32,z-10)<9||Object.values(AREA).some(a=>Math.hypot(a.x-x,a.z-z)<a.r+1))continue;
      const sc=.7+rnd()*.9;o.position.set(x,1.2+1.9*sc,z);o.scale.setScalar(sc);o.rotation.y=rnd()*3;o.updateMatrix();cone.setMatrixAt(n,o.matrix);
      o.position.set(x,.6,z);o.scale.setScalar(1);o.updateMatrix();trunk.setMatrixAt(n,o.matrix);n++;}
    cone.count=trunk.count=n;scene.add(cone,trunk);}

  // the motorcycle: a naked bike with rider (the group keeps the name "van", it is the vehicle)
  const van=new THREE.Group();scene.add(van);
  {const DK=0x2A2B27,b=new THREE.Group();b.scale.setScalar(1.3);van.add(b);
    [1.25,-1.25].forEach(z=>{const w=cyl(.62,.62,.3,18,DK,0,.62,z,b);w.rotation.z=Math.PI/2;const r=cyl(.4,.4,.32,14,MAG,0,.62,z,b);r.rotation.z=Math.PI/2;const h=cyl(.14,.14,.36,8,DK,0,.62,z,b);h.rotation.z=Math.PI/2;});
    [-.17,.17].forEach(x=>{const f=box(.1,1.25,.1,GREY,x,1.12,1.07,b);f.rotation.x=-.33;const a=box(.09,.09,1.15,GREY,x,.68,-.72,b);a.rotation.x=.06;});
    box(.5,.56,.85,DK,0,.82,.12,b);box(.42,.2,.5,GREY,0,.5,.2,b);                       // engine
    box(.56,.46,.95,MAG,0,1.36,.28,b);box(.6,.1,.5,INK,0,1.6,.3,b);                      // tank
    box(.44,.14,.95,INK,0,1.3,-.6,b);const tl=box(.3,.2,.55,MAG,0,1.43,-1.12,b);tl.rotation.x=.28;box(.2,.1,.06,0xFF3B30,0,1.5,-1.4,b); // seat, tail, rear light
    box(.36,.26,.24,INK,0,1.52,.98,b);box(.26,.12,.05,WHITE,0,1.5,1.11,b);               // headlight
    box(1.04,.07,.07,INK,0,1.78,.8,b);box(.16,.1,.1,DK,-.5,1.78,.8,b);box(.16,.1,.1,DK,.5,1.78,.8,b); // handlebar
    const ex=cyl(.09,.13,1,8,GREY,.3,.56,-.5,b);ex.rotation.x=Math.PI/2;
    // rider
    box(.5,.34,.75,INK,0,1.56,-.38,b);[-.3,.3].forEach(x=>{const l=box(.2,.7,.22,INK,x,1.2,-.05,b);l.rotation.x=-.5;const a=box(.15,.15,.85,INK,x*1.05,2.02,.42,b);a.rotation.x=.42;});
    const to=box(.56,.9,.4,INK,0,2.08,-.22,b);to.rotation.x=.32;box(.5,.3,.1,MAG,0,2.2,-.44,b).rotation.x=.32;
    const he=new THREE.Mesh(new THREE.SphereGeometry(.31,12,10),M(MAG));he.position.set(0,2.68,.02);b.add(he);box(.4,.15,.12,INK,0,2.68,.26,b);}
  const shadow=new THREE.Mesh(new THREE.CircleGeometry(2.6,24),new THREE.MeshBasicMaterial({color:INK,transparent:true,opacity:.18}));shadow.rotation.x=-Math.PI/2;shadow.scale.set(.42,1.05,1);scene.add(shadow);
  const mark=new THREE.Mesh(new THREE.RingGeometry(.9,1.25,28),new THREE.MeshBasicMaterial({color:MAG,side:THREE.DoubleSide}));mark.rotation.x=-Math.PI/2;mark.position.y=.08;mark.visible=false;scene.add(mark);

  // driving
  const car={x:START.x,z:START.z,h:START.h,v:0};let leanT=0,lean=0;let camH=car.h,target=null,tAge=0,gateIn=false;
  const keys={};const KM={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'};
  addEventListener('keydown',e=>{const k=KM[e.code];if(!k||S.panel||!S.started||e.target.closest('button,a,input'))return;keys[k]=true;target=null;mark.visible=false;e.preventDefault();});
  addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=false;});
  addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
  const ray=new THREE.Raycaster(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),v2=new THREE.Vector2(),hit=new THREE.Vector3();
  let down=false;
  const aim=e=>{const r=cv.getBoundingClientRect();v2.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(v2,cam);
    if(ray.ray.intersectPlane(plane,hit)&&Math.hypot(hit.x-car.x,hit.z-car.z)<170){target={x:Math.max(-76,Math.min(76,hit.x)),z:Math.max(-116,Math.min(ZMAX-1,hit.z))};tAge=0;mark.position.set(target.x,.08,target.z);mark.visible=true;}};
  cv.addEventListener('pointerdown',e=>{if(S.panel||!S.started)return;down=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}aim(e);$('#hint').hidden=true;});
  cv.addEventListener('pointermove',e=>{if(down&&!S.panel)aim(e);});
  const up=()=>{down=false;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  const wrap=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;};

  let slowT=0; // after a station bubble the bike rolls slowly for a moment, so there is time to read
  function step(dt){
    let thr=0,steer=0;
    if(keys.u||keys.d||keys.l||keys.r){thr=(keys.u?1:0)-(keys.d?.6:0);steer=(keys.l?1:0)-(keys.r?1:0);if(car.v<-.5)steer=-steer;}
    else if(target){const dx=target.x-car.x,dz=target.z-car.z,dist=Math.hypot(dx,dz);tAge+=dt;
      if(dist<2.8||(tAge>5&&dist<9&&!down)){target=null;mark.visible=false;}
      else{const diff=wrap(Math.atan2(dx,dz)-car.h),ad=Math.abs(diff);steer=Math.max(-1,Math.min(1,diff*2.4));
        thr=ad>1.9?.4:ad>1?.65:1;if(dist<7&&ad>1)thr=.28;if(dist<10&&!down)thr*=Math.max(.4,dist/10);}}

    for(const s of stations){const dx=nx-s.x,dz=nz-s.z,d=Math.hypot(dx,dz),m=s.r+1.8;if(d<m&&d>0){nx=s.x+dx/d*m;nz=s.z+dz/d*m;car.v*=.9;}}
    car.x=Math.max(-78,Math.min(78,nx));car.z=Math.max(-117,Math.min(ZMAX,nz));
  }
  function triggers(){
    for(const s of stations){const d=Math.hypot(car.x-s.x,car.z-s.z),rt=s.r+5.6;

      if(d>rt+2.5)s.inside=false;}
    for(const q of tokens){if(S.found[q.i])continue;const d=Math.hypot(car.x-q.x,car.z-q.z);
      if(d<3.4&&!q.inside){q.inside=true;collect(q.i);return;}
      if(d>6)q.inside=false;}
    const ing=car.z<GATE.z+3&&Math.abs(car.x-GATE.x)<7;
    if(ing&&!gateIn){gateIn=true;openPanel({t:'rep',gate:true});}else if(car.z>GATE.z+9)gateIn=false;
  }
  const nx=$('#nx'),arr=$('#arr'),nxt=$('#nxt');let hudT=0;
  function hud(dt){
    hudT+=dt;if(hudT<.12)return;hudT=0;
    let tg=null,bd=1e9;const nxp=PATH.find(id=>!S.seen[id]);
    if(nxp){const s=stations.find(x=>x.id===nxp);tg={x:s.x,z:s.z,n:s.k};bd=Math.hypot(car.x-s.x,car.z-s.z);}
    else for(const s of stations){if(S.seen[s.id])continue;const d=Math.hypot(car.x-s.x,car.z-s.z);if(d<bd){bd=d;tg={x:s.x,z:s.z,n:s.k};}}
    if(!tg){for(const q of tokens){if(S.found[q.i])continue;const d=Math.hypot(car.x-q.x,car.z-q.z);if(d<bd){bd=d;tg={x:q.x,z:q.z,n:'+'};}}}
    if(!tg){tg={x:GATE.x,z:GATE.z,n:t('nxAll')};bd=Math.hypot(car.x-tg.x,car.z-tg.z);}
    const rel=wrap(Math.atan2(tg.x-car.x,tg.z-car.z)-camH);
    arr.style.transform='rotate('+(-rel)+'rad)';nxt.textContent=tg.n+' · '+Math.round(bd)+' m';
  }
  function size(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?66:55;cam.updateProjectionMatrix();}
  addEventListener('resize',size);size();
  let last=performance.now(),tt=0;
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;tt+=dt;
    if(!S.panel&&S.started){step(dt);triggers();hud(dt);}
    van.position.set(car.x,Math.abs(car.v)>1&&!reduce?Math.sin(tt*18)*.03:0,car.z);van.rotation.y=car.h;
    if(S.panel||!S.started)leanT=0;lean+=(leanT-lean)*Math.min(1,7*dt);van.rotation.z=reduce?0:-lean*.5;
    shadow.position.set(car.x,.06,car.z);shadow.rotation.z=car.h;
    camH+=wrap(car.h-camH)*Math.min(1,3.2*dt);
    const port=innerWidth<innerHeight,dist=port?17:14,hgt=port?11:8.5,lift=S.panel?0:0;
    const fx=Math.sin(camH),fz=Math.cos(camH);
    cam.position.set(car.x-fx*dist,hgt+lift,car.z-fz*dist);cam.lookAt(car.x+fx*5,3.6,car.z+fz*5); // look a little higher, so the year boards above the stations stay in view
    for(const q of tokens){if(!q.m.visible)continue;q.m.rotation.y=tt*1.2+q.i;q.m.position.y=2.3+(reduce?0:Math.sin(tt*2+q.i)*.35);}
    if(mark.visible&&!reduce)mark.scale.setScalar(1+Math.sin(tt*6)*.08);

  }
  requestAnimationFrame(frame);
  return {
    stop(){car.v=0;target=null;mark.visible=false;down=false;for(const k in keys)keys[k]=false;},
    sync(){for(const s of stations){s.ring.material.opacity=S.seen[s.id]?.12:.55;s.ring.material.color.set(S.seen[s.id]?INK:MAG);}
      for(const q of tokens){const v=!S.found[q.i];q.m.visible=v;q.sh.visible=v;}
      for(const z of zones)z.draw(nArea(z.k));},
    reset(){car.x=START.x;car.z=START.z;car.h=START.h;car.v=0;camH=car.h;target=null;mark.visible=false;gateIn=false;stations.forEach(s=>s.inside=false);tokens.forEach(q=>q.inside=false);this.sync();},
    // for tests

}

render(true);
makeWorld().then(w=>{W=w;if(w){w.sync();window.__W=w;}else document.body.classList.add('no3d');render(false);});
